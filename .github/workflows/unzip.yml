name: Unzip Project
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ls -la
          if [ -f GrayTrackAndroid.zip ]; then
            unzip -o GrayTrackAndroid.zip
            rm GrayTrackAndroid.zip
            git config user.name "moknethunter"
            git config user.email "moknethunter@github.com"
            git add.
            git commit -m "ready"
            git push
          else
            echo "no zip file found"
           
